# Devnet Configuration
# Для локальной разработки и тестирования

[general]
log_level = "debug"
network = "devnet"

[wallet]
keypair_path = "config/wallets/deployer-devnet.json"

[aggregator]
program_id = "41pWaFUUTpWocERbe4D6G1jEuxya9XZRXMgXLwR9thSx"

[rpc]
# Публичный Solana devnet RPC (бесплатный)
# Лимит: ~40 req/s, достаточно для разработки
primary_url = "https://api.devnet.solana.com"

# Резервные RPC (опционально)
# Раскомментируй и добавь свой Helius API ключ для fallback:
# fallback_urls = ["https://devnet.helius-rpc.com/?api-key=YOUR_KEY"]
fallback_urls = []

# Таймаут и retry настройки
timeout_ms = 15000
max_retries = 3

[redis]
url = "redis://localhost:6379"
pool_size = 10
# TTL кэша в ms (500ms для devnet - нормально)
cache_ttl_ms = 500

[strategy]
# Минимальный профит в базисных пунктах
min_profit_bps = 1
# Минимальный абсолютный профит в lamports
min_profit_lamports = 1
# Максимальный slippage в базисных пунктах
max_slippage_bps = 100
# Максимум хопов в маршруте
max_hops = 3
# Минимальная ликвидность в USD
min_liquidity_usd = 1000
# Размер сделки в lamports
trade_amount_lamports = 1000000

[execution]
# Цена compute unit в microlamports
compute_unit_price = 1000
# Лимит compute units
compute_unit_limit = 400000
# Использовать Jito bundle (false для devnet)
use_jito = false
jito_tip_lamports = 0
allow_stateful_setup_in_dry_run = false
opportunity_cooldown_secs = 1
max_opportunities_per_cycle = 5
target_trades_per_minute = 30
