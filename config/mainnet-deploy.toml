# Mainnet Deploy Configuration
# Для деплоя и инициализации aggregator program на mainnet.
# Не использовать для торгового цикла.

[general]
log_level = "info"
network = "mainnet-beta"

[wallet]
keypair_path = "config/wallets/deployer-mainnet.json"

[aggregator]
program_id = "DMCPSH38kwbcXxwyaHdXqEf4JCTdgdTwMJwcEMHPrEqK"

[rpc]
primary_url = "https://api.mainnet-beta.solana.com"
fallback_urls = []
timeout_ms = 15000
max_retries = 3

[redis]
url = "redis://localhost:6379"
pool_size = 5
cache_ttl_ms = 500

[strategy]
min_profit_bps = 1
min_profit_lamports = 1
max_slippage_bps = 100
max_hops = 3
min_liquidity_usd = 1000
trade_amount_lamports = 1000000

[execution]
compute_unit_price = 5000
compute_unit_limit = 400000
use_jito = false
jito_tip_lamports = 0
allow_stateful_setup_in_dry_run = false
opportunity_cooldown_secs = 1
max_opportunities_per_cycle = 5
target_trades_per_minute = 30
