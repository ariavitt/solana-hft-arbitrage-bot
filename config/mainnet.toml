# Mainnet Configuration
# ⚠️  ВНИМАНИЕ: Используй только с реальными средствами, которые готов потерять!

[general]
log_level = "info"
network = "mainnet-beta"

[wallet]
keypair_path = "~/.config/solana/id.json"

[aggregator]
program_id = "DMCPSH38kwbcXxwyaHdXqEf4JCTdgdTwMJwcEMHPrEqK"

[rpc]
# ВАЖНО: Публичный RPC имеет жёсткие лимиты
# Для HFT обязателен платный RPC:
# - Helius (https://helius.dev) - от $49/мес
# - Triton (https://triton.one) - для серьёзного HFT
# - QuickNode VIP tier
# - Собственный валидатор

# Замени на свой RPC endpoint:
primary_url = "https://api.mainnet-beta.solana.com"

# Резервные RPC для fallback
fallback_urls = [
    # "https://mainnet.helius-rpc.com/?api-key=YOUR_KEY",
    # "https://your-triton-endpoint.com"
]

# Таймаут - короче для mainnet (HFT критично!)
timeout_ms = 5000
max_retries = 2

[redis]
url = "redis://localhost:6379"
# Больший пул для mainnet
pool_size = 20
# Короткий TTL - цены меняются быстро
cache_ttl_ms = 100

[strategy]
# Минимальный профит в базисных пунктах
min_profit_bps = 1
# Минимальный абсолютный профит в lamports
min_profit_lamports = 1
# Строгий slippage для mainnet
max_slippage_bps = 30
# Максимум хопов
max_hops = 3
# Минимальная ликвидность - выше для mainnet
min_liquidity_usd = 50000
# Маленький размер сделки для micro-arb
trade_amount_lamports = 1000000

[execution]
# Высокий priority fee для mainnet
compute_unit_price = 10000
compute_unit_limit = 400000
# Jito bundle - ОБЯЗАТЕЛЬНО для mainnet MEV защиты
use_jito = true
# Tip для Jito validator (в lamports)
jito_tip_lamports = 10000
allow_stateful_setup_in_dry_run = false
opportunity_cooldown_secs = 1
max_opportunities_per_cycle = 5
target_trades_per_minute = 30
