[workspace]
resolver = "2"
members = [
    "crates/bot-core",
    "crates/rpc-proxy",
    "crates/pool-deserializer",
    "crates/pool-poller",
    "crates/pricing-engine",
    "crates/strategy",
    "crates/tx-builder",
    "crates/arb-bot",
    "programs/arbitrage-aggregator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["ariavitt"]
repository = "https://github.com/ariavitt/solana-hft-arbitrage-bot"

[workspace.dependencies]
# === Solana ===
solana-sdk = "1.18"
solana-client = "1.18"
solana-rpc-client = "1.18"
solana-rpc-client-api = "1.18"
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"

# === Async Runtime ===
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# === Serialization ===
borsh = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
toml = "0.8"

# === Math ===
uint = "0.9"
num-bigint = "0.4"
num-traits = "0.2"

# === Redis ===
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.14"

# === HTTP ===
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# === WebSocket ===
tokio-tungstenite = "0.21"

# === Config ===
config = "0.14"
clap = { version = "4.4", features = ["derive"] }

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Metrics ===
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# === Error Handling ===
thiserror = "1.0"
anyhow = "1.0"

# === Crypto ===
bs58 = "0.5"
base64 = "0.21"

# === Utils ===
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true

