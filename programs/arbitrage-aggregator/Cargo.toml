[package]
name = "arbitrage-aggregator"
version = "0.1.0"
description = "Solana arbitrage aggregator with CPI routing and profit protection"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "arbitrage_aggregator"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = { version = "1.36", features = ["full"] }

